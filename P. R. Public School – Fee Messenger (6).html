<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>P. R. Public School – Fee Messenger</title>
<style>
:root{color-scheme:light;--bg:#f7f8fa;--card:#fff;--tx:#1d2330;--mut:#6b7280;--ac:#1e6fd9;--ok:#16a34a;--bd:#e6e8ee;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
main{max-width:520px;margin:0 auto;padding:18px 16px 32px}
header{text-align:center;margin-bottom:18px}
header img{width:84px;height:auto}
header h1{font-size:19px;margin:6px 0 0}
header p{margin:2px 0 0;color:var(--mut);font-size:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:16px;margin-bottom:14px}
.step{display:flex;align-items:center;gap:8px;font-weight:700;margin-bottom:10px}
.step b{display:inline-flex;width:24px;height:24px;border-radius:50%;background:var(--ac);color:#fff;font-size:13px;align-items:center;justify-content:center}
textarea{width:100%;min-height:96px;font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:12px;padding:10px;resize:vertical}
button{font:inherit;font-weight:700;border:0;border-radius:12px;padding:12px 16px;background:var(--ac);color:#fff;cursor:pointer}
button.sec{background:var(--bg);color:var(--tx);border:1px solid var(--bd)}
.up{display:block;text-align:center;border:2px dashed var(--ac);color:var(--ac);border-radius:14px;padding:22px 10px;font-weight:700;cursor:pointer}
.up input{display:none}
.hint{color:var(--mut);font-size:13px;margin-top:8px;text-align:center}
.seg{display:flex;gap:6px;margin-top:10px}
.seg button{flex:1;padding:9px}
.seg button.off{background:var(--bg);color:var(--tx);border:1px solid var(--bd)}
.prev{white-space:pre-wrap;background:#f0f6ff;border-radius:12px;padding:10px;font-size:15px;margin-top:10px}
.bar{height:8px;background:var(--bd);border-radius:6px;overflow:hidden;margin:4px 0 8px}
.bar i{display:block;height:100%;width:0;background:var(--ok);transition:width .2s}
.big{width:100%;padding:18px;font-size:18px;background:var(--ok)}
.big:disabled{background:#c9ced6}
.item{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 0;border-top:1px solid var(--bd)}
.item .n{font-weight:600}
.item small{color:var(--mut)}
.item button{padding:7px 12px;font-size:14px}
.done{color:var(--ok);font-weight:700;font-size:14px}
.link{background:none;color:var(--mut);font-weight:400;padding:8px 0 0;font-size:13px;border:0;text-decoration:underline}
#send,#list{display:none}
.who{display:flex;align-items:center;gap:12px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.chips button{padding:7px 12px;font-size:14px;border-radius:20px;background:var(--bg);color:var(--tx);border:1px solid var(--bd)}
.chips button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
select,.q{width:100%;font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:12px;padding:10px;margin-bottom:10px}
.sum{display:flex;justify-content:space-between;gap:8px;font-size:14px;margin-bottom:6px}
.sum b{font-size:16px}
.item.p{opacity:.55}
.ed{background:none;color:var(--ac);padding:0 4px;font-size:14px;border:0}
.ei{width:140px;padding:6px 8px;font-size:14px;border-radius:8px;margin:0;border:1px solid var(--bd);background:var(--bg)}
#rep{display:none;width:100%;min-height:90px;font-size:12px;margin-top:8px}
</style>
</head>

<div class="seg" style="margin:0 0 10px"><button id="en">English</button><button id="hi" class="off">हिन्दी</button></div>
<textarea id="tpl"></textarea>
<div class="seg"><button id="wa">WhatsApp</button><button id="sms" class="off">SMS</button></div>
<div class="prev" id="prev"></div>
</div>

<div class="card">
<div class="step"><b>3</b> Send</div>
<div id="mwrap"><div class="sum"><span>Months to collect</span></div><div class="chips" id="mchips"></div></div>
<select id="cls"></select>
<div class="sum"><span>Fees pending <b id="tot"></b></span><span id="stat"></span></div>
<div class="bar"><i id="fill"></i></div>
<button class="big" id="next">Send next ▶</button>
<div style="display:flex;justify-content:space-between"><button class="link" id="dl">⬇ Download report</button><button class="link" id="reset">↻ Resend to all</button></div>
<textarea id="rep" readonly></textarea>
</div>
</div>

<div class="card" id="list"><input class="q" id="q" placeholder="🔍 Search name or number"><div id="items"></div></div>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
var MK=[],MS=[],SK={np:0,nd:0},S=[],mode='wa',L='en',TK='fee',CF='',Q='',E=-1,KEY='prps_fee_v3';
var $=function(i){return document.getElementById(i)};
function isFee(){return TK==='fee'||TK==='feeexam'}
var TP={
fee:{n:'Fee reminder',en:'This is a reminder from P. R. Public School, Pindohari-Mau. Your fees are pending. Kindly pay at the earliest. Thank you!',hi:'यह पी. आर. पब्लिक स्कूल, पिंडोहरी-मऊ की ओर से सूचना है। आपकी फीस बकाया है। कृपया शीघ्र जमा करें। धन्यवाद!'},
feeexam:{n:'Fee + Exam reminder',en:'This is a reminder from P. R. Public School, Pindohari-Mau.\n\nYour school fees are pending. Kindly pay the pending fees at the earliest.\n\nImportant: The Half-Yearly Examination is starting from 10-10-2026. Please ensure that all pending fees are cleared before the examination.\n\nThank you for your cooperation.\n\nP. R. Public School, Pindohari-Mau',hi:'यह पी. आर. पब्लिक स्कूल, पिंडोहरी-मऊ की ओर से सूचना है।\n\nआपके बच्चे की स्कूल फीस बकाया है। कृपया बकाया फीस शीघ्र जमा करें।\n\nज़रूरी सूचना: अर्द्धवार्षिक परीक्षा 10-10-2026 से शुरू हो रही है। कृपया परीक्षा से पहले सभी बकाया फीस जमा करना सुनिश्चित करें।\n\nआपके सहयोग के लिए धन्यवाद।\n\nपी. आर. पब्लिक स्कूल, पिंडोहरी-मऊ'},
hol:{n:'Holiday',en:'School will remain closed on [date]. Classes will resume as usual after the holiday. - P. R. Public School',hi:'विद्यालय [तारीख] को बंद रहेगा। अवकाश के बाद कक्षाएं सामान्य रूप से चलेंगी। - पी. आर. पब्लिक स्कूल'},
exam:{n:'Exam',en:'Exams will begin on [date]. Please make sure your child is well prepared. - P. R. Public School',hi:'परीक्षाएं [तारीख] से शुरू होंगी। कृपया अपने बच्चे की अच्छी तैयारी कराएं। - पी. आर. पब्लिक स्कूल'},
ptm:{n:'PTM',en:'A Parent-Teacher Meeting is on [date] at [time]. Your presence is requested. - P. R. Public School',hi:'अभिभावक-शिक्षक बैठक [तारीख] को [समय] बजे है। आपकी उपस्थिति अपेक्षित है। - पी. आर. पब्लिक स्कूल'},
my:{n:'Write my own',en:'',hi:''}};
function save(){try{localStorage.setItem(KEY,JSON.stringify({S:S,t:$('tpl').value,m:mode,L:L,TK:TK,MK:MK,MS:MS}))}catch(e){}}
function restore(){try{var d=JSON.parse(localStorage.getItem(KEY)||'null');if(d){S=d.S||[];MK=d.MK||[];MS=d.MS||MK.slice();mode=d.m||'wa';L=d.L||'en';TK=d.TK||'fee';if(d.t)$('tpl').value=d.t;else $('tpl').value=TP[TK][L]}else $('tpl').value=TP.fee.en}catch(e){$('tpl').value=TP.fee.en}}
function esc(x){return String(x).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function cap(k){return k.charAt(0).toUpperCase()+k.slice(1)}
function fv(s){var f=s.f||{};if(!MK.length||MS.length===MK.length)return parseFloat(String(f.fees0!==undefined?f.fees0:(f.fees||'')).replace(/[^\d.]/g,''))||0;return MS.reduce(function(a,k){return a+(parseFloat(f[k])||0)},0)}
function mt(s){var f=s.f||{};if(!MK.length)return f.month||'';return MK.filter(function(k){return MS.indexOf(k)>=0&&(parseFloat(f[k])||0)>0}).map(cap).join(', ')}
function amt(s){return fv(s)}
function money(n){return 'Rs. '+n.toLocaleString('en-IN')}
function msg(s){var f=s.f||{};f.name=s.name;f.firstname=s.name.split(' ')[0];f.fees=String(fv(s)||'');f.month=mt(s);
var t=$('tpl').value,hasN=/\{(first)?name\}/i.test(t),hasF=/\{(fees|month)\}/i.test(t);
t=t.replace(/\{([^}]+)\}/g,function(m,k){k=k.trim().toLowerCase();return f[k]!==undefined?f[k]:m});
if(!hasN)t=(f.father?(L==='hi'?'प्रिय अभिभावक ('+s.name+'),\n':'Dear Parent of '+s.name+',\n'):(L==='hi'?'प्रिय ':'Dear ')+s.name+',\n')+t;
var fx=f.fees.replace(/^(rs\.?|₹)\s*/i,'');
if(!hasF&&(TK==='fee')&&(fx||f.month))t+='\n\n'+(L==='hi'?'देय फीस: ₹'+fx+(f.month?' ('+f.month+')':''):'Fees due: Rs. '+fx+(f.month?' for '+f.month:''));
if(!hasF&&TK==='feeexam'&&(fx||f.month)){var dl=(L==='hi'?'देय फीस: ₹'+fx+(f.month?' ('+f.month+')':''):'Fees due: Rs. '+fx+(f.month?' for '+f.month:'')),pa=t.split('\n\n');if(pa.length>=3){pa.splice(2,0,dl);t=pa.join('\n\n')}else t+='\n\n'+dl}
return t}
function link(s){var p=s.phone.replace(/\D/g,'');if(p.length===10)p='91'+p;var t=encodeURIComponent(msg(s));
return mode==='wa'?'https://wa.me/'+p+'?text='+t:'sms:+'+p+'?body='+t}
function inCls(s){return !CF||s.cls===CF}
function sk(s){return isFee()&&(s.paid||(MK.length>0&&fv(s)<=0))}
function queue(){return S.filter(function(s){return inCls(s)&&!sk(s)&&!s.sent})}
function go(s){s.sent=true;save();render();window.open(link(s),'_blank')}
function render(){
var has=S.length>0;$('send').style.display=has?'block':'none';$('list').style.display=has?'block':'none';
$('wa').className=mode==='wa'?'':'off';$('sms').className=mode==='sms'?'':'off';
$('en').className=L==='en'?'':'off';$('hi').className=L==='hi'?'':'off';
var c='';Object.keys(TP).forEach(function(k){c+='<button data-k="'+k+'" class="'+(k===TK?'on':'')+'">'+TP[k].n+'</button>'});$('chips').innerHTML=c;
if(!has)return;
var cl=[];S.forEach(function(s){if(s.cls&&cl.indexOf(s.cls)<0)cl.push(s.cls)});cl.sort();
$('cls').style.display=cl.length?'block':'none';
$('cls').innerHTML='<option value="">All classes</option>'+cl.map(function(x){return '<option'+(x===CF?' selected':'')+'>'+esc(x)+'</option>'}).join('');
$('mwrap').style.display=(MK.length&&isFee())?'block':'none';
$('mchips').innerHTML='<button data-m="*" class="'+(MS.length===MK.length?'on':'')+'">All</button>'+MK.map(function(k){return '<button data-m="'+esc(k)+'" class="'+(MS.indexOf(k)>=0?'on':'')+'">'+esc(cap(k))+'</button>'}).join('');
var sc=S.filter(inCls),q=queue(),nx=q[0];
$('prev').textContent=msg(nx||sc[0]||S[0]);
var act=sc.filter(function(s){return !sk(s)}),done=act.filter(function(s){return s.sent}).length;
$('fill').style.width=(act.length?done/act.length*100:0)+'%';
$('stat').textContent=done+' of '+act.length+' sent';
$('tot').textContent=isFee()?money(act.reduce(function(a,s){return a+amt(s)},0)):'-';
$('next').disabled=!nx;$('next').textContent=nx?'Send next ▶  ('+nx.name+')':(act.length?'All done ✓':'No students to send');
var ql=Q.toLowerCase(),h='';
S.forEach(function(s,i){if(!inCls(s))return;if(ql&&(s.name+' '+s.phone).toLowerCase().indexOf(ql)<0)return;
var ph=(E===i)?'<input class="ei" id="ei" value="'+esc(s.phone)+'" inputmode="tel"> <button class="ed" data-a="ok" data-i="'+i+'">Save</button>':esc(s.phone)+' <button class="ed" data-a="ed" data-i="'+i+'">✎</button>';
var info=(s.cls?' · '+esc(s.cls):'')+((s.f&&s.f.father)?' · '+esc(s.f.father):'')+(fv(s)?' · Rs. '+fv(s):'');
h+='<div class="item'+(sk(s)?' p':'')+'"><div><div class="n">'+esc(s.name)+'</div><small>'+ph+info+'</small></div>'+(sk(s)?'<span class="done">No dues ✓</span>':s.sent?'<span class="done">✓ Sent</span> <button class="sec" data-a="go" data-i="'+i+'">↻ Resend</button>':'<button class="sec" data-a="go" data-i="'+i+'">Send</button>')+'</div>'});
$('items').innerHTML=h||'<small>No students found.</small>';
if(E>=0){var e=$('ei');if(e&&document.activeElement!==e)e.focus()}}
function fixPhone(x){x=String(x==null?'':x).trim();if(/^[\d.]+e\+?\d+$/i.test(x))x=String(Math.round(Number(x)));return x.replace(/\.0+$/,'')}
function fromRows(rows){
rows=rows.filter(function(r){return r&&r.some(function(c){return String(c||'').trim()})});if(rows.length<1)return 0;
var h=rows[0].map(function(c){return String(c||'').replace(/^\uFEFF/,'').trim().toLowerCase()});
var fi=function(re){return h.findIndex(function(c){return re.test(c)})};
var n=fi(/^(student'?s?\s*)?name$/);if(n<0)n=h.findIndex(function(c){return /name/.test(c)&&!/father|mother|parent|guardian/.test(c)});
var p=fi(/mobile|phone|whatsapp|contact|mob/);if(p<0)p=fi(/number/);var start=1;
if(n<0||p<0||n===p){n=0;p=1;start=/\d{7,}/.test(String(rows[0][1]||'').replace(/\D/g,''))?0:1;h=[]}
var fe=fi(/^due$|fee|due|amount|balance|pending/),mo=fi(/^(month|period)$/),cl=fi(/class|std|grade/),pd=fi(/paid|status/),fa=fi(/father|parent|guardian/);
var MN=/^(jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)/,mc=[];h.forEach(function(k,j){if(MN.test(k)&&k.length<=9)mc.push(j)});
S=[];SK={np:0,nd:0};MK=mc.map(function(j){return h[j]});MS=MK.slice();
for(var i=start;i<rows.length;i++){var r=rows[i],nm=String(r[n]||'').trim(),ph=fixPhone(r[p]);
if(!nm)continue;if(!/\d{7,}/.test(ph.replace(/\D/g,''))){SK.np++;continue}
var f={};h.forEach(function(k,j){if(k&&j!==n&&j!==p)f[k]=String(r[j]==null?'':r[j]).trim()});
if(fe>=0)f.fees=String(r[fe]||'').replace(/[^\d.]/g,'');if(mo>=0)f.month=String(r[mo]||'').trim();
else if(mc.length){f.month=mc.filter(function(j){return (parseFloat(String(r[j]||'').replace(/[^\d.-]/g,''))||0)>0}).map(function(j){var k=String(rows[0][j]).trim();return k.charAt(0).toUpperCase()+k.slice(1)}).join(', ')}
f.fees0=f.fees;if(fa>=0)f.father=String(r[fa]||'').trim();
var nodue=fe>=0&&pd<0&&(parseFloat(f.fees)||0)<=0;if(nodue)SK.nd++;
S.push({name:nm,phone:ph,sent:false,f:f,cls:cl>=0?String(r[cl]||'').trim():'',paid:nodue||(pd>=0&&/^(y|yes|paid|1|true|done|clear)/i.test(String(r[pd]||'').trim()))})}
return S.length}
function parseText(t){return t.replace(/^\uFEFF/,'').split(/\r?\n/).map(function(l){var o=[],c='',q=false,d=(l.match(/\t/)?'\t':(l.indexOf(';')>l.indexOf(',')&&l.indexOf(';')>=0?';':','));
for(var i=0;i<l.length;i++){var ch=l[i];if(ch==='"')q=!q;else if(ch===d&&!q){o.push(c);c=''}else c+=ch}o.push(c);return o})}
$('file').onchange=function(){var inp=this,f=inp.files[0];if(!f)return;var r=new FileReader();
r.onload=function(){try{var rows,buf=new Uint8Array(r.result);
if(/\.(xlsx|xls)$/i.test(f.name)){if(!window.XLSX)throw new Error('Excel reader not loaded');var wb=XLSX.read(buf,{type:'array'});rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,raw:false})}
else{var enc=(buf[0]===0xFF&&buf[1]===0xFE)?'utf-16le':(buf[0]===0xFE&&buf[1]===0xFF)?'utf-16be':'utf-8';rows=parseText(new TextDecoder(enc).decode(buf))}
var c=fromRows(rows);CF='';Q='';E=-1;
if(c){var pd=S.filter(function(s){return s.paid}).length;$('upt').textContent='✅ '+f.name;$('fmsg').textContent=c+' students loaded'+(pd?' · '+pd+' have no dues (skipped for fee reminders)':'')+(SK.np?' · '+SK.np+' left out: no mobile number':'')}else{$('fmsg').textContent='Could not read the file. The file needs Name and Mobile columns in the first row'}
save();render()}catch(e){$('fmsg').textContent='Error: '+e.message}inp.value=''};
r.readAsArrayBuffer(f)};
$('chips').onclick=function(e){var b=e.target.closest('button');if(!b)return;TK=b.dataset.k;$('tpl').value=TP[TK][L];save();render()};
function setL(x){L=x;if(TP[TK][x])$('tpl').value=TP[TK][x];save();render()}
$('en').onclick=function(){setL('en')};$('hi').onclick=function(){setL('hi')};
$('mchips').onclick=function(e){var b=e.target.closest('button');if(!b)return;var m=b.dataset.m;
if(m==='*')MS=MK.slice();else{var i=MS.indexOf(m);if(i>=0){if(MS.length>1)MS.splice(i,1)}else MS.push(m)}
save();render()};
$('cls').onchange=function(){CF=this.value;render()};
$('q').oninput=function(){Q=this.value;render()};
$('next').onclick=function(){var s=queue()[0];if(s)go(s)};
$('items').onclick=function(e){var b=e.target.closest('button');if(!b)return;var i=+b.dataset.i,a=b.dataset.a;
if(a==='go')go(S[i]);else if(a==='ed'){E=i;render()}else if(a==='ok'){var v=$('ei').value.trim();if(/\d{7,}/.test(v.replace(/\D/g,''))){S[i].phone=v}E=-1;save();render()}};
$('reset').onclick=function(){S.forEach(function(s){s.sent=false});save();render()};
$('dl').onclick=function(){var rows=[['Name','Mobile','Class','Due','Months','Status']];
S.forEach(function(s){rows.push([s.name,s.phone,s.cls,fv(s)||'',mt(s),s.paid?'No dues (skipped)':s.sent?'Sent':'Not sent'])});
var csv='\uFEFF'+rows.map(function(r){return r.map(function(c){return '"'+String(c).replace(/"/g,'""')+'"'}).join(',')}).join('\r\n');
var show=function(){var r=$('rep');r.style.display='block';r.value=csv;r.select()};
if(window.claude&&claude.use){claude.use('downloads').then(function(d){if(!d)return show();return d.save({filename:'fee-report.csv',data:csv}).catch(function(e){if(!e||e.code!=='declined')show()})}).catch(show)}else show()};
$('wa').onclick=function(){mode='wa';save();render()};
$('sms').onclick=function(){mode='sms';save();render()};
$('tpl').oninput=function(){save();render()};
restore();render();
</script>
</body>
</html>
